name: agent-bench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check API keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" || -z "$ANTHROPIC_API_KEY" ]]; then
            echo "Set OPENAI_API_KEY and ANTHROPIC_API_KEY in repository Actions secrets." >&2
            exit 1
          fi
      - name: Install pinned agent CLIs
        run: npm install --global @openai/codex@0.162.1 @anthropic-ai/claude-code@2.1.296
      - name: Run benchmark
        uses: ./
        with:
          config: examples/benchmark.config.json
          output: benchmark-results/run.json
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: agent-bench-results
          path: benchmark-results/
          if-no-files-found: ignore
